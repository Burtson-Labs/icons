name: publish

# Publishes @burtson-labs/icons when package.json carries a version that is not
# on npm yet. It runs only after the ci workflow has passed for that exact main
# commit, so a failing check can never ship. Pushing without a version bump is a
# no-op, and re-running is safe. A manual run republishes the current main
# commit, again only if its ci run passed.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # A green ci run for a push to main in this repository. head_branch alone is
    # not enough: a pull request from a fork's own "main" branch also has it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # look up the ci run on a manual dispatch
      id-token: write # npm provenance (signed build attestation)
      packages: write # GitHub Packages mirror, for org repos that route @burtson-labs there
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ci passed for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful ci run for $SHA on main; not publishing"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      # No dependency cache in the release job: what ships is installed fresh
      # from the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      # ci ran the full check on this commit; this only rebuilds what ships.
      - run: npm run build
      - run: npm pack --dry-run

      - name: Skip if this version is already on the registry
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on the registry; nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts: prepublishOnly would rerun the whole check, which ci
      # already passed for this commit.
      # The registry can take minutes to show a version it has just accepted,
      # so a queued run for a later commit may try again. npm refuses to
      # publish over an existing version (E403); that is the version being on
      # the registry, not a failure.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: |
          set +e
          npm publish --provenance --access public --ignore-scripts 2>&1 | tee publish.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && grep -qE "E403|EPUBLISHCONFLICT|cannot publish over|previously published" publish.log; then
            echo "::notice title=Already published::The registry already has this version; nothing to do."
            exit 0
          fi
          exit "$rc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Some Burtson Labs apps route the whole @burtson-labs scope to GitHub
      # Packages (.npmrc), so the same version is published there too.
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm config set "//npm.pkg.github.com/:_authToken" "$GH_TOKEN" --location=project
          if npm view "$NAME@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on GitHub Packages"
          else
            set +e
            npm publish --registry https://npm.pkg.github.com --ignore-scripts 2>&1 | tee gh-publish.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ] && grep -qE "E403|E409|EPUBLISHCONFLICT|cannot publish over|previously published" gh-publish.log; then
              echo "$NAME@$VERSION is already on GitHub Packages"
            else
              exit "$rc"
            fi
          fi
