name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run validate
      - name: Originality (against Lucide)
        run: npm run originality
      - name: Lint
        run: npm run lint
      - name: Typecheck (scripts and generated declarations)
        run: npm run typecheck
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Site
        run: npm run site
      - name: Generated files are committed
        # preview/ and the README block are rebuilt from icons/; a stale copy
        # means a README that shows different icons from the package.
        run: |
          git diff --exit-code -- README.md preview || {
            echo "::error::run npm run build and commit README.md and preview/"; exit 1; }
          test -z "$(git status --porcelain -- preview)" || { git status --porcelain -- preview; echo "::error::untracked preview files; run npm run build and commit"; exit 1; }
      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icons-site-${{ github.sha }}
          path: site/dist/
          retention-days: 14

  sentinel:
    # Secrets (working tree and full history), SAST rules, CI and supply-chain
    # checks. Sentinel is our own auditor; this repo has to pass it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: Burtson-Labs/sentinel-audit@a760cbb00db0e8ac9333aa8192c5c291eb2dca1e # v0.2.1
        with:
          fail-on: findings
